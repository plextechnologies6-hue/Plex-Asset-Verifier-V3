{% extends "base.html" %}
{% block title %}Sign In | Plex{% endblock %}
{% block content %}
<div class="auth-bg">
  <div class="login-card modern-login">
    <img src="{{ url_for('static', filename='plex-logo.png') }}" class="login-logo" alt="Plex Technologies">
    <div class="eyebrow">SECURE PLATFORM ACCESS</div>
    <h1>Welcome back</h1>
    <p>Sign in to manage clients, verification sessions and FAR reconciliation.</p>
    <form method="post">
      <label>Email<input type="email" name="email" required autofocus placeholder="name@company.com"></label>
      <label>Password<input type="password" name="password" required placeholder="Enter your password"></label>
      <button class="btn widebtn">Sign In →</button>
    </form>
    <a class="back-link" href="{{ url_for('landing') }}">← Back to Plex platform</a>
  </div>
</div>
{% endblock %}
