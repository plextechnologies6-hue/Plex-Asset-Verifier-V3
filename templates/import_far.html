<form method="post" enctype="multipart/form-data">
  <div class="form-group">
    <label>FAR File</label>
    <input type="file" name="file" accept=".csv,.xlsx,.xls" required>
  </div>

  <div class="info-box">
    This release accepts <strong>CSV</strong> and <strong>Excel (.xlsx)</strong> files.
    The first row must contain column headers. Common column names are matched automatically
    (Asset Name, Tag Number, Serial Number, Location, Model, User, Custodian, etc.).
  </div>

  <div class="form-group">
    <label>
      <input type="checkbox" name="replace_existing" value="yes">
      Replace existing FAR records in this session
    </label>
  </div>

  <button type="submit" class="btn btn-primary">Import FAR</button>
</form>
